<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ultra Media Element - YouTube Player Example</title>
  <script type="module" src="https://cdn.jsdelivr.net/npm/media-chrome@4/+esm"></script>
  <script type="module" src="../dist/ultra-media-element.es.js"></script>
  <style>
    body {
      font-family: sans-serif;
    }
    ultra-media {
      display: block;
      width: 640px;
      height: 360px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <h1>YouTube Player Example</h1>

  <ultra-media src="https://www.youtube.com/watch?v=M7lc1qf-MkE" controls autoplay muted></ultra-media>

  <button id="playBtn">Play</button>
  <button id="pauseBtn">Pause</button>

  <script>
    const player = document.querySelector('ultra-media');
    const playBtn = document.getElementById('playBtn');
    const pauseBtn = document.getElementById('pauseBtn');

    playBtn.onclick = () => player.play();
    pauseBtn.onclick = () => player.pause();
  </script>

</body>
</html>
