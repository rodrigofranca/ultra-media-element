<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ultra Media Element - YouTube Player Example</title>
  <script type="module" src="https://cdn.jsdelivr.net/npm/media-chrome@4/+esm"></script>
  <script type="module" src="../dist/ultra-media-element.es.js"></script>
  <style>
    body {
      font-family: sans-serif;
    }
    media-controller {
      display: block;
      width: 640px;
      height: 360px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <h1>YouTube Player Example</h1>

  <media-controller>
    <ultra-media src="https://www.youtube.com/watch?v=e-1pVKUWlOQ" slot="media" autoplay muted crossorigin></ultra-media>
    <media-control-bar>
      <media-play-button></media-play-button>
      <media-time-range></media-time-range>
      <media-time-display></media-time-display>
      <media-mute-button></media-mute-button>
      <media-volume-range></media-volume-range>
      <media-fullscreen-button></media-fullscreen-button>
    </media-control-bar>
  </media-controller>

</body>
</html>
