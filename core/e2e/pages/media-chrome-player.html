<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ultra-media + media-chrome e2e harness</title>
  <!-- Local devDependency copies only (hermetic.ts blocks anything else) -
       see e2e/server/static-server.mjs's /media-chrome/ route. -->
  <script type="module" src="/dist/ultra-media.es.js"></script>
  <script type="module" src="/media-chrome/index.js"></script>
  <script type="module" src="/media-chrome/menu/index.js"></script>
</head>
<body>
  <media-controller id="controller">
    <ultra-media id="player" slot="media" playsinline></ultra-media>
    <media-rendition-menu id="rendition-menu" hidden anchor="auto"></media-rendition-menu>
    <media-control-bar>
      <media-play-button></media-play-button>
      <media-mute-button></media-mute-button>
      <media-time-display></media-time-display>
      <media-time-range></media-time-range>
      <media-playback-rate-button></media-playback-rate-button>
      <media-rendition-menu-button invoketarget="rendition-menu"></media-rendition-menu-button>
    </media-control-bar>
  </media-controller>
</body>
</html>
